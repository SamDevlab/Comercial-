# Troque o nome do host e os caminhos do certificado antes de habilitar.
# O limite precisa ser >= CENTRAL_PDF_MAX_BYTES + multipart overhead (padrão: 9 MiB).
server {
    listen 80;
    server_name central.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name central.example.com;

    ssl_certificate /etc/letsencrypt/live/central.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/central.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 9m;

    add_header X-Content-Type-Options nosniff always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8765/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
