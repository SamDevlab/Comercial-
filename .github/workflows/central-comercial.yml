name: Central Comercial
on:
  push:
    branches:
      - "feat/central-comercial-*"
    paths:
      - "central_comercial/**"
      - "tests/**"
      - "deploy/**"
      - "requirements.txt"
      - ".github/workflows/central-comercial.yml"
  pull_request:
    paths:
      - "central_comercial/**"
      - "tests/**"
      - "deploy/**"
      - "requirements.txt"
      - ".github/workflows/central-comercial.yml"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r deploy/requirements-linux.txt
      - name: Compile
        run: python -m compileall -q central_comercial
      - name: Unit tests with fake SMTP (no email sent)
        run: python -m unittest discover -s tests -v
      - name: Boot single-worker Gunicorn and check health in isolated runner
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          import time
          from urllib.request import urlopen

          env = os.environ.copy()
          env.update({
              "CENTRAL_ADMIN_PASSWORD_HASH": "ci-placeholder-only",
              "CENTRAL_SESSION_SECRET": "ci-placeholder-session-secret-not-for-production",
              "CENTRAL_PUBLIC_ORIGIN": "http://127.0.0.1:8765",
              "CENTRAL_BIND": "127.0.0.1",
              "CENTRAL_PORT": "8765",
              "CENTRAL_TRUSTED_PROXY_HOPS": "0",
              "LARK_SMTP_USER": "",
              "LARK_SMTP_APP_PASSWORD": "",
          })
          process = subprocess.Popen([
              sys.executable, "-m", "gunicorn", "--workers", "1", "--threads", "4",
              "--timeout", "35", "--bind", "127.0.0.1:8765", "--access-logfile", "-",
              "--access-logformat", "%(m)s %(U)s %(s)s", "--error-logfile", "-",
              "central_comercial:create_app()",
          ], env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              for _ in range(50):
                  if process.poll() is not None:
                      raise RuntimeError("Gunicorn exited before health check")
                  try:
                      with urlopen("http://127.0.0.1:8765/healthz", timeout=1) as response:
                          assert response.status == 200
                          assert response.read() == b"ok"
                          print("Gunicorn health check passed")
                          break
                  except OSError:
                      time.sleep(0.2)
              else:
                  raise RuntimeError("Gunicorn health check timed out")
          finally:
              process.terminate()
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  process.kill()
                  process.wait(timeout=5)
          PY
