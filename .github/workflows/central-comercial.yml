name: Central Comercial
on:
  push:
    branches:
      - "feat/central-comercial-*"
    paths:
      - "central_comercial/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/central-comercial.yml"
  pull_request:
    paths:
      - "central_comercial/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/central-comercial.yml"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q central_comercial
      - name: Unit tests with fake SMTP (no email sent)
        run: python -m unittest discover -s tests -v
